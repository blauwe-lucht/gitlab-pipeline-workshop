name: gitlab-lab

services:
  gitlab:
    image: gitlab/gitlab-ce:19.4.2-ce.0
    container_name: gitlab
    hostname: gitlab
    ports:
      - "8929:8929"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:-Workshop-Pipelines-Lab}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        puma['worker_processes'] = 0
        sidekiq['concurrency'] = 5
        prometheus_monitoring['enable'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
    healthcheck:
      # The image's own gitlab-healthcheck reports healthy before the first reconfigure finishes.
      test:
        [
          "CMD",
          "/opt/gitlab/embedded/bin/curl",
          "--fail",
          "--silent",
          "--max-time",
          "10",
          "http://localhost:8929/-/readiness",
        ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 10m
      start_interval: 10s

  runner-init:
    image: docker:29.8.1-cli
    depends_on:
      gitlab:
        condition: service_healthy
    environment:
      GITLAB_CONTAINER: gitlab
      DOCKER_NETWORK: gitlab-lab
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner
      - ./register-runners.sh:/register-runners.sh:ro
    command: ["sh", "/register-runners.sh"]

  gitlab-runner:
    image: gitlab/gitlab-runner:v19.4.1
    container_name: gitlab-runner
    depends_on:
      runner-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-config:/etc/gitlab-runner
      # Jobs run in sibling containers that mount this volume (see register-runners.sh).
      # Mounted here only so Compose creates it and `down -v` removes it.
      - runner-cache:/cache
    healthcheck:
      # verify exits 0 even when GitLab is unreachable, so its output is checked too.
      test:
        [
          "CMD-SHELL",
          'out=$$(gitlab-runner verify 2>&1) && echo "$$out" | grep -q ''is valid'' && ! echo "$$out" | grep -qE ''not valid|failed''',
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 30s
      start_interval: 5s

networks:
  default:
    name: gitlab-lab

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
  runner-cache:
    name: gitlab-lab-runner-cache
