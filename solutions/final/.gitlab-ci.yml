include:
  - local: ci/templates.yml
  - component: $CI_SERVER_FQDN/roman/components/format-check@1.0.0
    inputs:
      stage: check
      files: src/*.cpp src/*.hpp tests/*.cpp

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - check
  - build
  - test
  - release

build:
  stage: build
  extends: .conan-build
  script:
    - bash ci/build.sh
  artifacts:
    paths:
      - build/roman
      - build/roman_tests
    expire_in: 1 week

unit-tests:
  stage: test
  extends: .cpp
  needs: [build]
  script:
    - ./build/roman_tests --gtest_output=xml:report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

smoke-run:
  stage: test
  extends: .cpp
  needs: [build]
  script:
    - ./build/roman MCMXCIV

tidy:
  stage: test
  extends: [.conan-build, .thorough]
  needs: []
  script:
    - bash ci/check-tidy.sh

sanitizers:
  stage: test
  extends: [.conan-build, .thorough]
  needs: []
  script:
    - bash ci/test-sanitizers.sh

release:
  stage: release
  extends: .cpp
  needs: [build, unit-tests, smoke-run]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
  environment:
    name: production
    url: $CI_PROJECT_URL/-/packages
  script:
    - bash ci/release.sh
