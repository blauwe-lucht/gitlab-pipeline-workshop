.cpp:
  image: workshop-cpp:1

.conan-build:
  extends: .cpp
  variables:
    CONAN_HOME: $CI_PROJECT_DIR/.conan2
  cache:
    key:
      files:
        - conanfile.txt
      prefix: $CI_JOB_NAME
    paths:
      - .conan2/

.thorough:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
