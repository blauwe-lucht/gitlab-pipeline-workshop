default:
  image: workshop-cpp:1

variables:
  CONAN_HOME: $CI_PROJECT_DIR/.conan2

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

stages:
  - build
  - test
  - package

build:
  stage: build
  cache:
    key: conan
    paths:
      - .conan2/
  script:
    - conan profile detect --exist-ok
    - conan install . --output-folder=build --build=missing
    - cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=build/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Release
    - cmake --build build
  artifacts:
    paths:
      - build/roman
      - build/roman_tests

unit-tests:
  stage: test
  script:
    - ./build/roman_tests --gtest_output=xml:report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml

smoke-run:
  stage: test
  script:
    - ./build/roman MCMXCIV

package:
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - tar -czf roman-$CI_COMMIT_TAG.tar.gz -C build roman
  artifacts:
    paths:
      - roman-$CI_COMMIT_TAG.tar.gz
